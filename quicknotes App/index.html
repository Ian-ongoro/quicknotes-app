<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - Fast & Simple Note Taking</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="script.css>
</head>
<body>

  <!-- Header Section -->
  <header class="app-header">
    <div class="header-container">
      <h1>QuickNotes</h1>
      <p class="tagline">Capture your thoughts, ideas, and tasks instantly.</p>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-container">
    
    <!-- Task 1: "Add a note" Section -->
    <section class="card add-note-section">
      <h2>Add a Note</h2>
      <form id="note-form" class="note-form" novalidate>
        <div class="form-group input-group">
          <label for="note-text" class="sr-only">Note Text</label>
          <input 
            type="text" 
            id="note-text" 
            placeholder="Write a note (max 200 chars)..." 
            maxlength="200"
            autocomplete="off"
          >
          <span id="char-counter" class="char-counter">0/200</span>
        </div>

        <div class="form-group select-group">
          <label for="note-category" class="sr-only">Category</label>
          <select id="note-category">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
          </select>
        </div>

        <button type="submit" id="add-btn" class="btn btn-primary">Add Note</button>
      </form>

      <!-- Task 1 & 4: Validation Error Message -->
      <p id="error-message" class="error-message" aria-live="polite"></p>
    </section>

    <!-- Task 1: "Your notes" Section -->
    <section class="card your-notes-section">
      <div class="notes-header">
        <h2>Your Notes</h2>
        <!-- Bonus Task: Clear All Button -->
        <button id="clear-all-btn" class="btn btn-danger-outline hidden">Clear All</button>
      </div>

      <!-- Task 5: Search Input -->
      <div class="search-box">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search notes by keyword..." 
          autocomplete="off"
        >
      </div>

      <!-- Task 4: Note Count Paragraph -->
      <p id="note-count" class="note-count">You have no notes yet.</p>

      <!-- Task 1 & 3: Empty Notes List Container -->
      <div id="notes-list" class="notes-list"></div>
    </section>

  </main>

  <!-- Footer Section -->
  <footer class="app-footer">
    <div class="footer-container">
      <p>&copy; QuickNotes App. Built for organization & productivity.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
